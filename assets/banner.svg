<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Chatty — real-time MERN chat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="me" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#93c5fd"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    .b{opacity:0;transform-box:fill-box;transform-origin:left bottom;animation:pop 9s ease-out infinite}
    .b2{animation-delay:1.4s}.b3{animation-delay:3.6s;transform-origin:right bottom}.b4{animation-delay:5.2s}
    .typing{opacity:0;animation:typing 9s infinite;animation-delay:2.2s}
    .dot{animation:bounce 1s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
    .tick2{opacity:0;animation:read 9s infinite;animation-delay:4.4s}
    .heart{opacity:0;transform-box:fill-box;transform-origin:center;animation:heart 9s infinite;animation-delay:6.4s}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    .float{animation:float 6s ease-in-out infinite}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
    @keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.92)}6%{opacity:1;transform:none}88%{opacity:1}96%,100%{opacity:0}}
    @keyframes typing{0%{opacity:0}2%,13%{opacity:1}15%,100%{opacity:0}}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes read{0%{opacity:0}4%,82%{opacity:1}90%,100%{opacity:0}}
    @keyframes heart{0%{opacity:0;transform:scale(0)}3%{opacity:1;transform:scale(1.35)}6%,62%{opacity:1;transform:scale(1)}70%,100%{opacity:0}}
    @keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @media (prefers-reduced-motion:reduce){.b,.tick2,.heart{animation:none;opacity:1}.typing{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <g fill="#93c5fd" opacity=".5">
      <circle class="float" cx="640" cy="60" r="2"/><circle class="float f2" cx="1140" cy="80" r="3"/>
      <circle class="float f3" cx="700" cy="290" r="2"/><circle class="float" cx="1110" cy="300" r="2"/>
      <circle class="float f2" cx="60" cy="300" r="2"/>
    </g>

    <!-- logo + title -->
    <rect x="70" y="92" width="56" height="56" rx="14" fill="#2563eb"/>
    <path d="M86 108h18a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-11l-7 6v-6a4 4 0 0 1-4-4v-10a4 4 0 0 1 4-4z M112 116h4a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4v5l-6-5h-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="146" y="138" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="url(#title)" letter-spacing="-1">Chatty</text>
    <text x="72" y="196" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#e5e7eb">Real-time chat on the MERN stack</text>
    <text x="72" y="228" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" fill="#9ca3af">Presence, typing, read receipts, reactions and moderation</text>
    <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">
<rect x="72" y="256" width="104" height="30" rx="15" fill="#0f172a" stroke="#1e3a8a"/><text x="124" y="276" text-anchor="middle" fill="#93c5fd">React 19</text>
<rect x="186" y="256" width="104" height="30" rx="15" fill="#0f172a" stroke="#1e3a8a"/><text x="238" y="276" text-anchor="middle" fill="#93c5fd">Express 5</text>
<rect x="300" y="256" width="104" height="30" rx="15" fill="#0f172a" stroke="#1e3a8a"/><text x="352" y="276" text-anchor="middle" fill="#93c5fd">MongoDB</text>
<rect x="414" y="256" width="104" height="30" rx="15" fill="#0f172a" stroke="#1e3a8a"/><text x="466" y="276" text-anchor="middle" fill="#93c5fd">Socket.io</text>
</g>

    <!-- chat window -->
    <rect x="720" y="40" width="420" height="260" rx="20" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>
    <text x="748" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f3f4f6">launch-team</text>
    <circle cx="1040" cy="69" r="5" fill="#10b981"/><circle class="pulse" cx="1040" cy="69" r="5" fill="#10b981"/>
    <text x="1052" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6ee7b7">3 online</text>
    <line x1="720" y1="90" x2="1140" y2="90" stroke="#1f2937"/>

    <g font-family="Segoe UI, system-ui, sans-serif" font-size="14">
      <g class="b">
        <circle cx="756" cy="122" r="14" fill="#1e3a8a"/><text x="756" y="127" text-anchor="middle" fill="#bfdbfe" font-weight="700">A</text>
        <rect x="778" y="106" width="200" height="34" rx="14" fill="#1f2937"/><text x="794" y="128" fill="#e5e7eb">Pushed the new build 🚀</text>
      </g>
      <g class="typing">
        <circle cx="756" cy="170" r="14" fill="#78350f"/><text x="756" y="175" text-anchor="middle" fill="#fde68a" font-weight="700">M</text>
        <rect x="778" y="154" width="62" height="32" rx="14" fill="#1f2937"/>
        <circle class="dot" cx="796" cy="170" r="3.5" fill="#9ca3af"/><circle class="dot d2" cx="809" cy="170" r="3.5" fill="#9ca3af"/><circle class="dot d3" cx="822" cy="170" r="3.5" fill="#9ca3af"/>
      </g>
      <g class="b b2" style="animation-delay:3.6s">
        <circle cx="756" cy="170" r="14" fill="#78350f"/><text x="756" y="175" text-anchor="middle" fill="#fde68a" font-weight="700">M</text>
        <rect x="778" y="154" width="216" height="34" rx="14" fill="#1f2937"/><text x="794" y="176" fill="#e5e7eb">Testing it now. So fast!</text>
      </g>
      <g class="b b3" style="animation-delay:4.4s">
        <rect x="858" y="206" width="262" height="36" rx="14" fill="url(#me)"/><text x="874" y="229" fill="#fff">Told you sockets would fix it</text>
        <text x="1110" y="260" text-anchor="end" fill="#6b7280" font-size="12">✓</text>
        <text class="tick2" x="1110" y="260" text-anchor="end" fill="#60a5fa" font-size="12" font-weight="700">✓✓ Read</text>
      </g>
      <g class="heart"><circle cx="862" cy="244" r="12" fill="#111827" stroke="#374151"/><text x="862" y="249" text-anchor="middle" font-size="13">❤️</text></g>
    </g>
  </g>
</svg>
